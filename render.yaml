databases:
  - name: chronotrade-db
    plan: free

services:
  - type: web
    name: chronotrade-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    context: ./backend
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: chronotrade-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000,https://chronotrade.vercel.app"
